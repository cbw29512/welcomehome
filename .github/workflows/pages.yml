name: GitHub Pages Staging

on:
  push:
    branches:
      - quality/github-ready
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-staging
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure and enable GitHub Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Prepare project-site staging artifact
        run: |
          python3 - <<'PY'
          import logging
          import shutil
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")
          source = Path("site")
          target = Path("pages-dist")
          base_path = "/welcomehome"
          noindex = '<meta name="robots" content="noindex,nofollow">'

          try:
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target)

              for page in target.rglob("*.html"):
                  text = page.read_text(encoding="utf-8")
                  text = text.replace('href="/', f'href="{base_path}/')
                  text = text.replace('src="/', f'src="{base_path}/')
                  if 'name="robots"' not in text:
                      text = text.replace("</head>", f"{noindex}\n</head>")
                  page.write_text(text, encoding="utf-8")

              # Staging must never compete with the eventual production URL in search.
              (target / "robots.txt").write_text(
                  "User-agent: *\nDisallow: /\n",
                  encoding="utf-8",
              )
              sitemap = target / "sitemap.xml"
              if sitemap.exists():
                  sitemap.unlink()

              (target / ".nojekyll").write_text("", encoding="utf-8")
              logging.info("Prepared noindex GitHub Pages staging artifact at %s/", base_path)
          except Exception:
              logging.exception("Could not prepare GitHub Pages staging artifact")
              raise
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
