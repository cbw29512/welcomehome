name: Quality Gate

on:
  push:
    branches:
      - main
      - "quality/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-quality:
    name: Static QA and spelling
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Compile Python generators
        run: python3 -m py_compile scripts/data.py scripts/generate_site.py scripts/generate_pdfs.py scripts/qa_site.py

      - name: Audit generated site structure
        run: python3 scripts/qa_site.py

      - name: Install spelling checker
        run: python3 -m pip install --disable-pip-version-check codespell==2.4.3

      - name: Check spelling
        run: >-
          codespell README.md netlify.toml scripts site
          --skip="site/downloads/*"
          --ignore-words-list="crate,nd"

  lighthouse:
    name: Lighthouse 100 gate
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Audit every HTML page
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
