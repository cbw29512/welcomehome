name: GitHub Pages Staging

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Prepare project-site paths
        run: |
          python3 - <<'PY'
          import logging
          import shutil
          from pathlib import Path

          logging.basicConfig(level=logging.INFO, format="%(levelname)s: %(message)s")
          source = Path("site")
          target = Path("pages-dist")
          base_path = "/welcomehome"

          try:
              if target.exists():
                  shutil.rmtree(target)
              shutil.copytree(source, target)
              for page in target.rglob("*.html"):
                  text = page.read_text(encoding="utf-8")
                  text = text.replace('href="/', f'href="{base_path}/')
                  text = text.replace('src="/', f'src="{base_path}/')
                  page.write_text(text, encoding="utf-8")
              (target / ".nojekyll").write_text("", encoding="utf-8")
              logging.info("Prepared %s for GitHub project Pages at %s/", target, base_path)
          except Exception:
              logging.exception("Could not prepare GitHub Pages artifact")
              raise
          PY

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: pages-dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
